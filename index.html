<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Newly Tool</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0812; --card:#12101c; --card2:#17142a; --line:#2a2250;
  --accent:#8b3cf6; --accent2:#a65cff; --text:#f3f0ff; --muted:#8e88a8;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:14px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px}
.brand{display:flex;align-items:center;gap:10px;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:22px}
.brand svg{width:24px;height:24px;fill:var(--accent2)}
.badge{border:1px solid var(--accent);color:var(--accent2);background:rgba(139,60,246,.15);padding:6px 14px;border-radius:999px;font-size:14px}
.hero{position:relative;height:310px;border-radius:22px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;padding:26px 24px;
  background:#0d0820}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(10,8,18,.85),transparent 60%)}
.hero>*{position:relative;z-index:1}
.hero>.hero-art{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.hero h1{font-family:'Space Grotesk',sans-serif;font-size:42px;line-height:1.1}
.hero p{color:#cfc8ea;margin-top:8px;font-size:17px}
.search{margin-top:22px;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid #1e1a33;border-radius:18px;padding:0 18px}
.search svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2;flex:none}
.search input{flex:1;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:16px;padding:18px 0}
.search input::placeholder{color:#5c5775}
.search:focus-within{border-color:var(--accent)}
.chips{display:flex;gap:10px;overflow-x:auto;padding:18px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid #221d3d;background:var(--card);color:#cfc8ea;font:500 16px 'Inter',sans-serif;padding:11px 22px;border-radius:999px;cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.list{display:flex;flex-direction:column;gap:18px;margin-top:14px}
.tool{background:var(--card);border:1px solid #1d1933;border-radius:22px;padding:24px 20px}
.tool:focus-within{border-color:var(--accent);box-shadow:0 0 22px rgba(139,60,246,.25)}
.top{display:flex;gap:16px;align-items:center}
.ico{width:58px;height:58px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;flex:none}
.ico svg{width:28px;height:28px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.top h2{font-family:'Space Grotesk',sans-serif;font-size:21px}
.tag{display:inline-block;margin-top:6px;background:rgba(139,60,246,.25);color:#7d4ac4;font-size:13px;padding:3px 12px;border-radius:8px}
.tool p{color:#b9b3d3;margin:18px 0 16px;line-height:1.5;font-size:16px}
.tool input{width:100%;background:#0d0b17;border:2px solid #2d2660;border-radius:12px;color:var(--text);font:15px ui-monospace,Menlo,monospace;padding:15px 14px;outline:0}
.tool input::placeholder{color:#4f4a68}
.tool input:focus{border-color:var(--accent2)}
.btn{margin-top:14px;width:100%;border:0;border-radius:16px;padding:16px;color:#fff;font:700 17px 'Inter',sans-serif;cursor:pointer;
  background:linear-gradient(90deg,#7b2ff0,#9b4cf8);display:flex;justify-content:center;align-items:center;gap:8px}
.btn svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.btn:active{transform:scale(.98)}
.out{display:none;margin-top:14px;padding:14px;border-radius:12px;background:#0d0b17;border:1px solid #2d2660;font-size:14px;line-height:1.5;word-break:break-word;white-space:pre-wrap;color:#d9d3f0}
.out.show{display:block}.out.err{border-color:#7a2a4a;color:#ffb3c7}
.out a{color:var(--accent2);font-weight:700}
.btn:disabled{opacity:.6;cursor:wait}
.empty{text-align:center;color:var(--muted);padding:40px 0;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(80px);background:var(--card2);border:1px solid var(--accent);padding:12px 20px;border-radius:14px;transition:.3s;font-size:15px;max-width:90%}
.toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
